<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>登录 · QDjob 配置编辑器</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    window.APP = { csrfToken: "{{ csrf_token }}", version: "{{ version }}", author: "{{ author }}" };
    (function () {
      var t = localStorage.getItem('qdjob-theme') || 'auto';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: min(380px, 100%); }
    .login-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
    .login-brand .brand-mark { width: 40px; height: 40px; font-size: 16px; }
    .login-title { text-align: center; font-size: 18px; font-weight: 700; }
    .login-sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-brand">
        <span class="brand-mark">QD</span>
      </div>
      <div class="login-title">QDjob 配置编辑器</div>
      <div class="login-sub">请输入访问口令</div>
      <form id="login-form">
        <div class="field">
          <input type="password" id="password" placeholder="访问口令" autocomplete="current-password" required>
        </div>
        <button class="btn primary" type="submit" id="login-btn" style="width:100%">登录</button>
      </form>
      <div class="mt-16 muted" style="font-size:12px;text-align:center">作者 {{ author }} · {{ version }}</div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 登录中';
      const res = await UI.api('POST', '/api/auth/login', { password: document.getElementById('password').value }, { silent: true });
      if (res && res.ok) {
        const token = res.data && res.data.csrf_token;
        if (token) UI.api('GET', '/api/meta', undefined, { silent: true }); // 触发一次会话
        window.location.href = '/';
      } else {
        UI.toast((res && res.message) || '登录失败', 'err');
        btn.disabled = false; btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
