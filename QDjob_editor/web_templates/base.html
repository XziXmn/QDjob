<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}QDjob 配置编辑器{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // 全局配置
    window.APP = {
      csrfToken: "{{ csrf_token }}",
      version: "{{ version }}",
      author: "{{ author }}"
    };
    // 尽早应用主题，避免闪烁
    (function () {
      var t = localStorage.getItem('qdjob-theme') || 'auto';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="appbar">
    <button class="icon-btn" id="menu-btn" aria-label="菜单">☰</button>
    <a class="brand" href="{{ url_for('page_overview') }}">
      <span class="brand-mark">QD</span>
      <span class="brand-text">QDjob 配置编辑器</span>
    </a>
    <span class="badge version-badge">{{ version }}</span>
    <div class="appbar-spacer"></div>
    <button class="icon-btn" id="theme-btn" aria-label="切换主题" title="切换主题">🌓</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav>
        <a class="nav-item {{ 'active' if active == 'overview' else '' }}" href="{{ url_for('page_overview') }}"><span>🏠</span>概览</a>
        <a class="nav-item {{ 'active' if active == 'users' else '' }}" href="{{ url_for('page_users') }}"><span>👤</span>用户</a>
        <a class="nav-item {{ 'active' if active == 'devices' else '' }}" href="{{ url_for('page_devices') }}"><span>📱</span>真实设备</a>
        <a class="nav-item {{ 'active' if active == 'run' else '' }}" href="{{ url_for('page_run') }}"><span>▶️</span>任务执行</a>
        <a class="nav-item {{ 'active' if active == 'logs' else '' }}" href="{{ url_for('page_logs') }}"><span>📄</span>日志</a>
        <a class="nav-item {{ 'active' if active == 'about' else '' }}" href="{{ url_for('page_about') }}"><span>ℹ️</span>关于</a>
      </nav>
      <div class="sidebar-footer">
        <div>作者: {{ author }}</div>
        <div>版本: {{ version }}</div>
      </div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
      <footer class="footer">
        <span>{{ project }} · 作者 {{ author }} · {{ version }}</span>
        <span>本项目为个人项目，仅供学习交流使用，请勿用于非法用途。</span>
      </footer>
    </main>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="toast-container" id="toast-container"></div>
  <div class="modal-root" id="modal-root"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
